
name: Greetings.Provisioning

on:
  workflow_dispatch:
    inputs:
      apply_changes:
        description: "Apply changes after approval"
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: project-bda2cfff-037e-48bf-ba4
  REGION: europe-west1

jobs:
  validate:
    name: Validate and preview IaC
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate configuration
        run: |
          ruby -ryaml -e '
            ["dev", "prod"].each do |env|
              file = "infrastructure/simplegreet-#{env}.yaml"
              data = YAML.load_file(file)
              abort "Invalid service" unless
                data.dig("metadata", "name") == "simplegreet-#{env}"
              abort "Invalid Cloud Run resource" unless
                data["apiVersion"] == "serving.knative.dev/v1" &&
                data["kind"] == "Service"
              puts "Validated: #{file}"
            end
          '

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Check images and preview changes
        shell: bash
        run: |
          for ENV in dev prod; do
            SERVICE="simplegreet-${ENV}"
            FILE="infrastructure/${SERVICE}.yaml"

            CURRENT=$(gcloud run services describe "$SERVICE" \
              --project="$PROJECT_ID" \
              --region="$REGION" \
              --format="value(spec.template.spec.containers[0].image)")

            EXPECTED=$(ruby -ryaml -e \
              'puts YAML.load_file(ARGV[0]).dig("spec","template","spec","containers",0,"image")' \
              "$FILE")

            if [[ "$CURRENT" != "$EXPECTED" ]]; then
              echo "Image mismatch for $SERVICE"
              echo "Refusing possible rollback"
              exit 1
            fi

            gcloud run services replace "$FILE" \
              --project="$PROJECT_ID" \
              --region="$REGION" \
              --dry-run

            echo "Preview successful: $SERVICE"
          done

  apply:
    name: Apply approved infrastructure
    needs: validate
    if: ${{ inputs.apply_changes == true }}
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Recheck images and apply
        shell: bash
        run: |
          for ENV in dev prod; do
            SERVICE="simplegreet-${ENV}"
            FILE="infrastructure/${SERVICE}.yaml"

            CURRENT=$(gcloud run services describe "$SERVICE" \
              --project="$PROJECT_ID" \
              --region="$REGION" \
              --format="value(spec.template.spec.containers[0].image)")

            EXPECTED=$(ruby -ryaml -e \
              'puts YAML.load_file(ARGV[0]).dig("spec","template","spec","containers",0,"image")' \
              "$FILE")

            if [[ "$CURRENT" != "$EXPECTED" ]]; then
              echo "Image mismatch: $SERVICE"
              exit 1
            fi

            gcloud run services replace "$FILE" \
              --project="$PROJECT_ID" \
              --region="$REGION" \
              --quiet

            echo "Applied: $SERVICE"
          done
